<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deutsch A2 : mots, grammaire, phrases</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F5;--surface:#FFFFFF;--surface-2:#E2E7F0;--ink:#1E2A44;--ink-2:#5B6786;--line:#D2D9E6;--on-ink:#FFFFFF;
  --der:#2B5BD7;--die:#D63E4A;--das:#1F8F66;
  --der-bg:#E2EAFC;--die-bg:#FBE4E6;--das-bg:#DCF2E9;
  --warn:#B98000;--warn-bg:#FBF0D2;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131A2C;--surface:#1D2642;--surface-2:#28335A;--ink:#E9EDF7;--ink-2:#9AA6C6;--line:#33406B;--on-ink:#131A2C;
    --der:#86A8FF;--die:#FF8791;--das:#5ED3A4;
    --der-bg:#243463;--die-bg:#4B2733;--das-bg:#1D4436;
    --warn:#F0C15A;--warn-bg:#4A3B14;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131A2C;--surface:#1D2642;--surface-2:#28335A;--ink:#E9EDF7;--ink-2:#9AA6C6;--line:#33406B;--on-ink:#131A2C;
  --der:#86A8FF;--die:#FF8791;--das:#5ED3A4;
  --der-bg:#243463;--die-bg:#4B2733;--das-bg:#1D4436;
  --warn:#F0C15A;--warn-bg:#4A3B14;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Jost","Futura","Century Gothic","Avenir Next",system-ui,sans-serif;font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--der);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:10px 16px 110px}
.top{display:flex;align-items:center;gap:12px;padding:8px 0 14px}
.mark{display:flex;gap:5px;align-items:flex-end}
.mark i{display:block;width:15px;height:15px}
.mark .s{background:var(--der)}
.mark .c{background:var(--die);border-radius:50%}
.mark .t{background:var(--das);clip-path:polygon(50% 0,100% 100%,0 100%)}
h1{font-size:1.4rem;margin:0;font-weight:700;letter-spacing:.01em}
.sub{color:var(--ink-2);font-size:.95rem;margin:0 0 14px}
.h2{font-size:.98rem;font-weight:600;color:var(--ink-2);margin:24px 0 8px}
.foot{color:var(--ink-2);font-size:.85rem;text-align:center;margin:18px 0 0}
.tiny{color:var(--ink-2);font-size:.82rem}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs .in{display:flex;max-width:560px;margin:0 auto}
.tab{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--ink-2);font-size:.72rem;font-weight:500;padding:6px 0}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--ink);font-weight:700}
.tab.on::after{content:"";position:absolute;top:-7px;width:26px;height:3px;background:var(--ink);border-radius:2px}

.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;font-size:.88rem;font-weight:600;color:var(--ink-2);padding:9px 4px;border-radius:9px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,30,60,.14)}

.btn{appearance:none;border:0;border-radius:12px;padding:14px 18px;font-size:1rem;font-weight:600;background:var(--ink);color:var(--on-ink)}
.btn.wide{display:block;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:9px 13px;font-size:.88rem;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.btn:active:not(:disabled){transform:scale(.985)}
.btns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btns .btn{flex:1;min-width:120px}

.rows{background:var(--surface);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.rowmain{flex:1;text-align:left;background:none;border:0;color:inherit;padding:14px 16px;display:block;min-width:0}
.rt{display:block;font-weight:600;font-size:1.02rem}
.rs{display:block;color:var(--ink-2);font-size:.86rem;margin-top:2px}
.bar{display:block;height:5px;background:var(--surface-2);border-radius:3px;margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--das)}
.mini{background:none;border:0;border-left:1px solid var(--line);font-size:.85rem;font-weight:600;color:var(--ink-2);padding:0 16px;color:var(--ink-2)}

.art{display:inline-block;font-weight:700;font-size:.95rem;padding:1px 8px;border-radius:6px;line-height:1.5}
.art.der{color:var(--der);background:var(--der-bg)}
.art.die{color:var(--die);background:var(--die-bg)}
.art.das{color:var(--das);background:var(--das-bg)}

.prog{height:5px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin:6px 0 12px}
.prog i{display:block;height:100%;background:var(--ink);transition:width .3s}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.link{background:none;border:0;color:var(--ink-2);font-size:.9rem;font-weight:600;padding:6px 0}

.fc{perspective:1200px;height:310px;margin:6px 0 12px;cursor:pointer}
.fc-in{position:relative;width:100%;height:100%;transition:transform .45s ease;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border-radius:20px;padding:22px 20px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:inset 0 7px 0 var(--gc,var(--line));overflow:auto}
.face.back{transform:rotateY(180deg)}
.big{font-size:2.15rem;font-weight:600;line-height:1.15;word-break:break-word;margin-top:6px}
.big.mid{font-size:1.65rem}
.lbl{font-size:.8rem;color:var(--ink-2);margin-bottom:2px}
.pl{margin-top:10px;font-size:.95rem;color:var(--ink-2)}
.pl b{color:var(--ink)}
.ex{margin-top:12px;font-size:1.02rem}
.exfr{color:var(--ink-2);font-size:.9rem;margin-top:2px}
.note{margin-top:12px;font-size:.84rem;background:var(--warn-bg);border-radius:9px;padding:7px 11px;text-align:left}
.hintline{position:absolute;bottom:10px;font-size:.78rem;color:var(--ink-2)}
.spkrow{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
.spk{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--line);color:var(--ink);border-radius:10px;padding:7px 12px;font-size:.85rem;font-weight:600}
.spk.sm{padding:3px 7px;margin-left:8px;vertical-align:middle;border-radius:8px}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g{border:0;border-radius:12px;padding:14px 4px;font-size:1rem;font-weight:700;color:var(--on-ink)}
.g.bad{background:var(--die)}
.g.mid{background:var(--warn)}
.g.ok{background:var(--das)}

.panel{background:var(--surface);border-radius:18px;padding:20px}
.panel.center{text-align:center}
.q{font-size:1.35rem;font-weight:500;line-height:1.4}
.gap{display:inline-block;min-width:3.4ch;border-bottom:3px solid var(--ink);margin:0 3px;text-align:center;font-weight:700}
.gap.ok{color:var(--das);border-color:var(--das)}
.gap.bad{color:var(--die);border-color:var(--die)}
.qfr{color:var(--ink-2);font-size:.95rem;margin-top:8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.opts.one{grid-template-columns:1fr}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opt{font-weight:600;font-size:1.05rem;padding:14px 10px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);text-align:center}
.opts.one .opt{text-align:left;padding:13px 14px}
.opt.der{color:var(--der);border-color:var(--der)}
.opt.die{color:var(--die);border-color:var(--die)}
.opt.das{color:var(--das);border-color:var(--das)}
.opt.ok{background:var(--das-bg);border-color:var(--das);color:var(--ink)}
.opt.bad{background:var(--die-bg);border-color:var(--die);color:var(--ink)}
.opt.dim{opacity:.5}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:.95rem}
.fb.ok{background:var(--das-bg)}
.fb.bad{background:var(--die-bg)}
.fb b{display:block;margin-bottom:3px}
.score{font-size:3rem;font-weight:700;line-height:1.1}
.miss{text-align:left;margin-top:14px;font-size:.95rem}
.miss div{padding:10px 0;border-top:1px solid var(--line)}
.miss small{display:block;color:var(--ink-2);margin-top:2px}

.slots{min-height:66px;border-bottom:2px solid var(--line);padding:6px 0 10px;display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-content:flex-start}
.slots .ph{color:var(--ink-2);font-size:.9rem;align-self:center}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;min-height:52px}
.tile{font-weight:600;font-size:1rem;padding:9px 13px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.slots.ok .tile{border-color:var(--das);background:var(--das-bg)}
.slots.bad .tile{border-color:var(--die);background:var(--die-bg)}

label.f{display:block;font-size:.88rem;font-weight:600;color:var(--ink-2);margin:0 0 10px}
.field{display:block;width:100%;font-size:1rem;padding:12px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);margin-top:5px;font-weight:400}
textarea.field{resize:vertical;min-height:60px}
.item{background:var(--surface);border-radius:16px;padding:16px;margin-bottom:12px}
.item .q{font-size:1.15rem}
.res{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:.93rem}
.res.ok{background:var(--das-bg)}
.res.bad{background:var(--die-bg)}
.res b{font-weight:700}
.err{background:var(--die-bg);border-radius:10px;padding:10px 12px;font-size:.92rem;margin-top:12px}
.off{background:var(--surface);border-radius:16px;padding:18px;color:var(--ink-2);font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.chip{background:var(--surface);border:1.5px solid var(--line);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:.88rem;font-weight:500}

.log{display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.b{max-width:90%;padding:10px 13px;border-radius:16px;font-size:.98rem;overflow-wrap:anywhere}
.b.me{align-self:flex-end;background:var(--ink);color:var(--on-ink);border-bottom-right-radius:5px}
.b.ai{align-self:flex-start;background:var(--surface);border-bottom-left-radius:5px}
.b .help{display:block;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);color:var(--ink-2);font-size:.88rem}
.b code{background:var(--surface-2);padding:0 4px;border-radius:4px}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer .field{margin:0;flex:1}

.wrow{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.wrow:last-child{border-bottom:0}
.wrow .w{flex:1;min-width:0}
.wrow .w b{font-weight:600}
.wrow .w small{display:block;color:var(--ink-2);font-size:.85rem}
.x{background:none;border:0;color:var(--ink-2);font-size:1.3rem;padding:0 6px}

details{background:var(--surface);border-radius:14px;margin-bottom:8px}
summary{list-style:none;padding:14px 16px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:1.3rem;color:var(--ink-2);font-weight:400}
details[open] summary::after{content:"\2013"}
.md{padding:0 16px 16px;font-size:.95rem}
.md p{margin:8px 0}
.md .scroll{overflow-x:auto;max-width:100%}
.md table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:300px}
.md td,.md th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.md th{font-weight:600;color:var(--ink-2)}
.md ul{margin:6px 0;padding-left:20px}
.md li{margin:4px 0}
@media (prefers-reduced-motion:reduce){.fc-in,.prog i{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="mark" aria-hidden="true"><i class="s"></i><i class="c"></i><i class="t"></i></div><h1>Deutsch A2</h1></header>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="Sections"><div class="in" id="nav"></div></nav>

/* ================= MOTS (cartes) ================= */
V.mots=function(){
  if(UI.fc)return fcView();
  if(UI.list)return listView(UI.list);
  const now=Date.now(),decks=allDecks(),all=allCards();
  const due=all.filter(c=>PR[c.id]&&PR[c.id].due<=now).length;
  const fresh=all.filter(c=>!PR[c.id]).length;
  const mast=all.filter(c=>PR[c.id]&&PR[c.id].box>=3).length;
  const rows=decks.map(d=>{
    const n=d.cards.length,dd=d.cards.filter(c=>PR[c.id]&&PR[c.id].due<=now).length,fr=d.cards.filter(c=>!PR[c.id]).length,m=d.cards.filter(c=>PR[c.id]&&PR[c.id].box>=3).length;
    const parts=[n+" mots"];if(dd)parts.push(dd+" à revoir");if(fr)parts.push(fr+" nouveaux");
    return `<div class="row"><button class="rowmain" data-a="study" data-id="${d.id}"><span class="rt">${esc(d.t)}</span><span class="rs">${parts.join(" · ")}</span><span class="bar"><i style="width:${Math.round(100*m/n)}%"></i></span></button><button class="mini" data-a="list" data-id="${d.id}">Liste</button></div>`;
  }).join("");
  return `<p class="sub">Retourne la carte, dis si tu la savais. Les mots ratés reviennent vite, les autres de plus en plus tard.</p>
  <div class="seg" role="group" aria-label="Sens des cartes"><button class="${DIR==="de"?"on":""}" data-a="dir" data-d="de">Allemand → français</button><button class="${DIR==="fr"?"on":""}" data-a="dir" data-d="fr">Français → allemand</button></div>
  <button class="btn wide" data-a="study" data-id="all">Réviser maintenant${due||fresh?` (${due} à revoir, ${Math.min(fresh,8)} nouveaux)`:""}</button>
  <h2 class="h2">Paquets</h2><div class="rows">${rows}</div>
  <p class="foot">${mast} mot${mast>1?"s":""} maîtrisé${mast>1?"s":""} sur ${all.length}</p>`;
};
function startFc(id){
  const now=Date.now(),cards=id==="all"?allCards():(allDecks().find(d=>d.id===id)||{cards:[]}).cards;
  const due=shuffle(cards.filter(c=>PR[c.id]&&PR[c.id].due<=now));
  const fresh=shuffle(cards.filter(c=>!PR[c.id])).slice(0,8);
  let q=due.concat(fresh).slice(0,20),practice=false;
  if(!q.length){q=shuffle(cards).slice(0,12);practice=true}
  UI.fc={id,q,i:0,flip:false,rev:false,known:0,retry:{},practice};
  render();toTop();
}
function fcCtl(){
  const s=UI.fc;
  if(!s.rev)return `<button class="btn wide" data-a="flip">Retourner</button>`;
  return `<div class="grades"><button class="g bad" data-a="grade" data-g="0">À revoir</button><button class="g mid" data-a="grade" data-g="1">Presque</button><button class="g ok" data-a="grade" data-g="2">Je sais</button></div>`;
}
function fcView(){
  const s=UI.fc;
  if(s.i>=s.q.length)return fcEnd();
  const c=s.q[s.i],gc=c.art?`var(--${c.art})`:"var(--line)";
  const detail=(c.pl?`<div class="pl">Pluriel : <b>die ${esc(c.pl)}</b></div>`:"")+`<div class="ex">${esc(c.ex)}</div><div class="exfr">${esc(c.exfr)}</div>`+(c.note?`<div class="note">${esc(c.note)}</div>`:"");
  const deFace=`<div>${artChip(c.art)}</div><div class="big">${esc(c.de)}</div>`;
  const frFace=`<div class="lbl">Français</div><div class="big mid">${esc(c.fr)}</div>`;
  const front=DIR==="de"?deFace:frFace, back=DIR==="de"?frFace+detail:deFace+detail;
  const say=c.art?c.art+" "+c.de:c.de;
  return `<div class="topline"><span class="tiny">${s.practice?"Entraînement · ":""}Carte ${Math.min(s.i+1,s.q.length)} sur ${s.q.length}</span><button class="link" data-a="fcquit">Quitter</button></div>
  <div class="prog"><i style="width:${Math.round(100*s.i/s.q.length)}%"></i></div>
  <div class="fc${s.flip?" flip":""}" style="--gc:${gc}" data-a="flip" role="button" tabindex="0" aria-label="Carte : touche pour retourner"><div class="fc-in"><div class="face">${front}<span class="hintline">Touche pour retourner</span></div><div class="face back">${back}</div></div></div>
  <div class="spkrow">${spkBtn(say,"Le mot")}${spkBtn(c.ex,"La phrase")}</div>
  <div id="fcctl">${fcCtl()}</div>`;
}
function fcEnd(){
  const s=UI.fc;
  return `<div class="panel center"><div class="score">${s.q.length>0?s.known:0}</div><p>${s.known>1?"cartes sues du premier coup":"carte sue du premier coup"} sur ${new Set(s.q.map(c=>c.id)).size}.</p><p class="tiny">Les cartes ratées reviendront bientôt. Reviens demain pour les autres.</p>
  <div class="btns"><button class="btn" data-a="study" data-id="${s.id}">Encore une session</button><button class="btn ghost" data-a="fcquit">Retour aux paquets</button></div></div>`;

function listView(id){

V.gram=function(){
  if(UI.g)return gView();
  const nouns=allCards().filter(c=>c.art).length;
  const rows=[`<div class="row"><button class="rowmain" data-a="gstart" data-id="art"><span class="rt">Der, die ou das ?</span><span class="rs">Devine le genre des mots du vocabulaire (${nouns} noms)</span></button></div>`]
    .concat(CATS.map(c=>{const d=c.items.filter(x=>GR[x.id]===1).length;return `<div class="row"><button class="rowmain" data-a="gstart" data-id="${c.id}"><span class="rt">${esc(c.t)}</span><span class="rs">${esc(c.s)} · ${d}/${c.items.length} réussis</span><span class="bar"><i style="width:${Math.round(100*d/c.items.length)}%"></i></span></button></div>`}));
  return `<p class="sub">Séries de 10 questions. Les questions que tu n'as pas encore réussies passent en premier, avec l'explication à chaque fois.</p>
  <button class="btn wide" data-a="gstart" data-id="mix">Mélange de tout</button>
  <h2 class="h2">Thèmes</h2><div class="rows">${rows.join("")}</div>`;
};
function gStart(id){
  let items;
  if(id==="art"){
    items=shuffle(allCards().filter(c=>c.art)).slice(0,10).map(c=>({id:"art:"+c.id,kind:"art",c,ans:c.art,opts:["der","die","das"]}));
  }else{
    const pool=id==="mix"?CATS.flatMap(c=>c.items):CATS.find(c=>c.id===id).items;
    items=pool.map(x=>({x,k:(GR[x.id]===1?1:0)+Math.random()*.9})).sort((a,b)=>a.k-b.k).slice(0,10).map(o=>Object.assign({},o.x,{opts:shuffle(o.x.all)}));
  }
  UI.g={id,items,i:0,pick:null,score:0,miss:[]};
  render();toTop();
}
function gapHTML(q,fill,cls){return esc(q).replace("___",`<span class="gap ${cls||""}">${fill?esc(fill):"&nbsp;&nbsp;&nbsp;"}</span>`)}
function gView(){
  const s=UI.g;
  if(s.i>=s.items.length)return gEnd();
  const it=s.items[s.i],done=s.pick!==null,okAns=done&&it.opts[s.pick]===it.ans;
  let head,fb="";
  if(it.kind==="art"){
    head=`<div class="lbl">Quel article ?</div><div class="big" style="text-align:center;margin:14px 0 4px">${done?artChip(it.ans)+" ":""}${esc(it.c.de)}</div><div class="qfr" style="text-align:center">${esc(it.c.fr)}</div>`;
    if(done)fb=`<div class="fb ${okAns?"ok":"bad"}"><b>${okAns?"Bien joué":"C'est « "+esc(it.ans)+" »"}</b>${esc(it.ans)} ${esc(it.c.de)}${it.c.pl?" · pluriel : die "+esc(it.c.pl):""}<br><span class="tiny">${esc(it.c.ex)}</span></div>`;
  }else if(it.kind==="gap"){
    head=`<div class="q">${gapHTML(it.q,done?it.opts[s.pick]:"",done?(okAns?"ok":"bad"):"")}</div><div class="qfr">${esc(it.fr)}</div>`;
    if(done)fb=`<div class="fb ${okAns?"ok":"bad"}"><b>${okAns?"Bien joué":"La bonne réponse : "+esc(it.ans)}</b>${esc(it.why)}</div>`;
  }else{
    head=`<div class="lbl">${esc(it.q)}</div><div class="q">« ${esc(it.fr)} »</div>`;
    if(done)fb=`<div class="fb ${okAns?"ok":"bad"}"><b>${okAns?"Bien joué":"La bonne phrase : "+esc(it.ans)}</b>${esc(it.why)}</div>`;
  }
  const cls=it.kind==="order"?"one":(it.kind==="art"?"three":"");
  const opts=it.opts.map((o,k)=>{
    let c="";
    if(done){c=o===it.ans?"ok":(k===s.pick?"bad":"dim")}else if(it.kind==="art")c=o;
    return `<button class="opt ${c}" data-a="gpick" data-i="${k}"${done?" disabled":""}>${esc(o)}</button>`;
  }).join("");
  return `<div class="topline"><span class="tiny">Question ${s.i+1} sur ${s.items.length}</span><button class="link" data-a="gquit">Quitter</button></div>
  <div class="prog"><i style="width:${Math.round(100*s.i/s.items.length)}%"></i></div>
  <div class="panel">${head}<div class="opts ${cls}">${opts}</div><div aria-live="polite">${fb}</div>
  ${done?`<div class="btns"><button class="btn" data-a="gnext">${s.i+1===s.items.length?"Voir le résultat":"Suivant"}</button></div>`:""}</div>`;
}
function gEnd(){
  const s=UI.g,n=s.items.length;
  const miss=s.miss.map(it=>it.kind==="art"?`<div><b>${esc(it.ans)} ${esc(it.c.de)}</b><small>${esc(it.c.fr)}</small></div>`:`<div>${it.kind==="gap"?gapHTML(it.q,it.ans,"ok"):"<b>"+esc(it.ans)+"</b>"}<small>${esc(it.why)}</small></div>`).join("");
  return `<div class="panel center"><div class="score">${s.score}/${n}</div><p>${s.score===n?"Sans faute.":s.score>=n*.7?"Solide. Reviens sur les erreurs ci-dessous.":"Continue, c'est en refaisant les séries que ça rentre."}</p>
  ${miss?`<div class="miss"><b>À retenir</b>${miss}</div>`:""}
  <div class="btns"><button class="btn" data-a="gstart" data-id="${s.id}">Rejouer</button><button class="btn ghost" data-a="gquit">Retour</button></div></div>`;
}

/* ================= TRADUIRE (phrases à construire) ================= */
function newT(){
  const pool=TRS.filter(x=>!TS[x.id]),list=pool.length?pool:TRS;
  let it=list[Math.floor(Math.random()*list.length)];
  if(UI.t&&list.length>1)while(it.id===UI.t.it.id)it=list[Math.floor(Math.random()*list.length)];
  const toks=it.de.split(" ").concat(it.extra).map((t,i)=>({id:i,t}));
  UI.t={it,bank:shuffle(toks),ans:[],st:"",sol:false};
}
V.trad=function(){
  if(!UI.t)newT();
  const t=UI.t,done=Object.keys(TS).length;
  const slots=t.ans.length?t.ans.map(a=>`<button class="tile" data-a="tback" data-id="${a.id}">${esc(a.t)}</button>`).join(""):`<span class="ph">Touche les mots dans l'ordre</span>`;
  const bank=t.bank.map(a=>`<button class="tile" data-a="tpick" data-id="${a.id}">${esc(a.t)}</button>`).join("");
  let fb="";
  if(t.st==="ok")fb=`<div class="fb ok" aria-live="polite"><b>Richtig !</b>${esc(t.it.de)} ${spkBtn(t.it.de,"","sm")}</div>`;
  else if(t.st==="bad")fb=`<div class="fb bad" aria-live="polite"><b>Pas tout à fait</b>Vérifie l'ordre des mots et les articles. Touche un mot pour le retirer.</div>`;
  if(t.sol&&t.st!=="ok")fb+=`<div class="fb ok"><b>Solution</b>${esc(t.it.de)}</div>`;
  const btns=t.st==="ok"
    ?`<div class="btns"><button class="btn" data-a="tnext">Phrase suivante</button></div>`
    :`<div class="btns"><button class="btn" data-a="tcheck"${t.ans.length?"":" disabled"}>Vérifier</button><button class="btn ghost" data-a="tclear"${t.ans.length?"":" disabled"}>Effacer</button><button class="btn ghost" data-a="tsol">Solution</button></div>`;
  return `<p class="sub">Construis la phrase allemande. Il y a parfois un mot en trop pour te piéger.</p>
  <div class="prog"><i style="width:${Math.round(100*done/TRS.length)}%"></i></div><div class="tiny">${done} phrase${done>1?"s":""} réussie${done>1?"s":""} sur ${TRS.length}</div>
  <div class="panel" style="margin-top:10px"><div class="lbl">Traduis</div><div class="q">« ${esc(t.it.fr)} »</div>
  <div class="slots ${t.st}">${slots}</div><div class="bank">${bank}</div>${fb}${btns}</div>`;
};

const THEMES=["La vie de tous les jours","Au restaurant","En ville et transports","Au travail","Santé et médecin","Courses et argent","Voyage et hôtel","Famille et amis","Loisirs et week-end"];
const FOCUS=["Tout mélangé","Prépositions","Accusatif et datif","Verbes modaux","Perfekt (passé)","weil / dass / deshalb","Verbes séparables","Négation (nicht / kein)"];
const SC={resto:["Au restaurant","un serveur dans un restaurant à Berlin"],shop:["Faire les courses","une vendeuse dans un supermarché"],doc:["Chez le médecin","une médecin généraliste"],way:["Demander son chemin","un passant dans la rue, qui aide l'élève à trouver la gare"],job:["Au travail","un collègue de bureau qui discute avec l'élève"],hotel:["À l'hôtel","un réceptionniste d'hôtel"],free:["Faire connaissance","un ami allemand qui rencontre l'élève pour la première fois"]};
const QS=["Quelle est la différence entre « kennen » et « wissen » ?","Comment savoir quand utiliser « dem » ou « den » ?","Explique-moi les verbes séparables simplement.","Pourquoi on dit « ich habe Hunger » et pas « ich bin Hunger » ?","Comment retenir les articles der, die, das ?"];
const PROF_RULES="Tu es un professeur d'allemand bienveillant et clair, pour un francophone de niveau A2 (débutant avancé). Réponds en français, de façon courte (150 mots maximum), avec 2 ou 3 exemples en allemand traduits en français. Évite le jargon. Mets en **gras** les mots clés. Si la question est floue, pose une seule question de clarification.";
function dialRules(sc){return `Tu es un partenaire de conversation pour un francophone qui apprend l'allemand (niveau A2).
Situation : tu joues ${SC[sc][1]}.
Règles :
- Ta réplique en allemand : 1 à 3 phrases courtes, vocabulaire simple (A2), puis une question pour relancer.
- Ensuite, aide en français : corrige avec bienveillance les erreurs de la dernière réponse de l'élève (cas, ordre des mots, conjugaison, article) en donnant la phrase corrigée. S'il n'y a aucune erreur, dis-le en quelques mots. Si l'élève écrit en français ou demande de l'aide, aide-le en français et propose-lui une phrase allemande à essayer.
Format EXACT, sans rien d'autre :
DE: <ta réplique en allemand>
FR: <aide ou correction en français, 1 à 3 phrases courtes>
Commence maintenant : salue l'élève et lance la situation (dans FR, donne-lui une consigne courte pour répondre).`}
function parseDF(t){const m=t.match(/^\s*DE:\s*([\s\S]*?)\s*(?:\n\s*FR:\s*([\s\S]*))?$/i);return m?{de:m[1].trim(),fr:(m[2]||"").trim()}:{de:t.trim(),fr:""}}

V.ia=function(){
  const a=UI.ai;
  const seg=`<div class="seg" role="tablist">${[["phr","Phrases"],["dial","Dialogue"],["prof","Prof"],["mots","Mots"]].map(x=>`<button class="${a.sub===x[0]?"on":""}" data-a="aisub" data-s="${x[0]}" role="tab">${x[1]}</button>`).join("")}</div>`;
  let body;
  if(a.sub==="mots")body=aiMots();
  else if(!SAMPLE)body=aiOff();
  else if(a.sub==="phr")body=aiPhr();
  else body=aiChat();

/* --- Phrases à traduire --- */
function aiPhr(){
  const a=UI.ai,p=a.phr;
  const opt=(arr,v)=>arr.map(x=>`<option${x===v?" selected":""}>${esc(x)}</option>`).join("");
  const items=p.items.map((it,i)=>{
    let res="";
    if(it.busy)res=`<div class="res">Claude corrige…</div>`;

const normS=s=>String(s).toLowerCase().replace(/[.,!?;:«»"'’]/g,"").replace(/\s+/g," ").trim();
async function phGen(){

Thème : ${a.theme}. Point de grammaire visé : ${a.focus}.
Varie les sujets et les phrases (graine : ${Math.random().toString(36).slice(2,7)}).
Réponds UNIQUEMENT par un tableau JSON, sans texte autour, de la forme :
[{"fr":"Je vais au cinéma avec mon ami.","de":"Ich gehe mit meinem Freund ins Kino.","astuce":"mit + datif"}]
"de" = une traduction allemande correcte et naturelle. "astuce" = un indice en français (10 mots maximum) qui ne donne pas la réponse.`;

async function phCheck(i){
  const it=UI.ai.phr.items[i];const ans=(it.ans||"").trim();
  if(!ans)return;
  if(normS(ans)===normS(it.de)){it.res={ok:true,correction:it.de,explication:"Exactement la phrase attendue."};render();return}
  it.busy=true;it.res=null;render();
  const prompt=`Tu es professeur d'allemand (niveau A2) et tu corriges un francophone.
Phrase à traduire : « ${it.fr} »
Traduction de référence : « ${it.de} »
Traduction de l'élève : « ${ans} »
Plusieurs traductions correctes existent : juge si la traduction de l'élève est correcte en allemand ET fidèle au sens, même si elle diffère de la référence. Ignore les majuscules et la ponctuation mineure.
Réponds UNIQUEMENT par un objet JSON : {"ok": true ou false, "correction": "phrase allemande corrigée (identique si correcte)", "explication": "en français, 1 à 2 phrases simples : ce qui est juste, ou l'erreur principale (cas, ordre des mots, conjugaison, article…)"}`;
  try{
    const r=await SAMPLE.json(prompt,{modelTier:"quick"});
    it.res={ok:!!r.ok,correction:String(r.correction||it.de),explication:String(r.explication||"")};
  }catch(e){it.res={ok:false,correction:it.de,explication:errCopy(e&&e.code)}}
  it.busy=false;render();
}

function chatInput(){

async function runChat(pend){
  const ch=UI.ai.chat;ch.busy=true;ch.err="";ch.stream="";ch.ctl=new AbortController();refreshChat();
  let got=false;
  try{
    const r=await SAMPLE(chatInput(),{cache:false,signal:ch.ctl.signal,modelTier:ch.mode==="prof"?"default":"quick",onText:o=>{ch.stream=o.text;paintStream()}});
    ch.log.push({role:"assistant",content:r.text});got=true;
  }catch(e){
    if(e&&e.text&&e.code!=="refused"){ch.log.push({role:"assistant",content:e.text});got=true}
    if(!e||e.code!=="cancelled")ch.err=errCopy(e&&e.code);
  }
  if(!got&&pend==="user"){const u=ch.log.pop();const el=$("#cin");if(el&&u)el.value=u.content}
  if(!got&&pend==="start")ch.started=false;
  ch.busy=false;ch.stream="";ch.ctl=null;
  if(pend==="start"&&!got)render();else refreshChat();
}
function chatSend(text){

A.gnext=()=>{const s=UI.g;s.i++;s.pick=null;render();toTop()};

A.tpick=b=>{const t=UI.t,k=t.bank.findIndex(x=>x.id==b.dataset.id);if(k<0)return;t.ans.push(t.bank.splice(k,1)[0]);t.st="";render()};
A.tback=b=>{const t=UI.t;if(t.st==="ok")return;const k=t.ans.findIndex(x=>x.id==b.dataset.id);if(k<0)return;t.bank.push(t.ans.splice(k,1)[0]);t.st="";render()};
A.tclear=()=>{const t=UI.t;t.bank=t.bank.concat(t.ans);t.ans=[];t.st="";render()};
A.tcheck=()=>{const t=UI.t,s=t.ans.map(a=>a.t).join(" ");if(s===t.it.de||t.it.alts.includes(s)){t.st="ok";TS[t.it.id]=1;store.set("trans",TS)}else t.st="bad";render()};
A.tsol=()=>{UI.t.sol=true;render()};
A.tnext=()=>{newT();render();toTop()};

A.aisub=b=>{UI.ai.sub=b.dataset.s;render()};
A.phgen=()=>{if(SAMPLE&&!UI.ai.phr.busy)phGen()};
A.phcheck=b=>{if(SAMPLE)phCheck(+b.dataset.i)};
A.phshow=b=>{const it=UI.ai.phr.items[+b.dataset.i];it.shown=true;it.res=null;render()};
A.cstart=()=>{const ch=UI.ai.chat;ch.log=[];ch.started=true;runChat("start")};
A.crestart=()=>{const ch=UI.ai.chat;if(ch.ctl)ch.ctl.abort();ch.log=[];ch.started=false;ch.busy=false;ch.err="";render()};
A.csend=()=>{const el=$("#cin");if(!el)return;const v=el.value;if(!v.trim())return;el.value="";chatSend(v)};
A.cstop=()=>{const ch=UI.ai.chat;if(ch.ctl)ch.ctl.abort()};
A.qs=b=>chatSend(QS[+b.dataset.i]);
A.mgen=b=>{if(SAMPLE&&!UI.ai.m.busy)mGen(b.dataset.t||UI.ai.m.theme)};
A.madd=b=>{addCustom(UI.ai.m.items[+b.dataset.i]);store.set("custom",CUSTOM);render()};
A.maddall=()=>{UI.ai.m.items.forEach(addCustom);store.set("custom",CUSTOM);render()};
A.mmanual=()=>{
  const m=UI.ai.m;let de=($("#mde").value||"").trim(),fr=($("#mfr").value||"").trim();
  if(!de||!fr){m.msg="Remplis les deux champs.";render();return}
  let art="";const r=de.match(/^(der|die|das)\s+(.+)$/i);if(r){art=r[1].toLowerCase();de=r[2]}
  CUSTOM.push({id:"c"+Date.now().toString(36),deck:"mes",de,art,pl:"",fr,ex:"",exfr:"",note:""});
  store.set("custom",CUSTOM);m.msg="Ajouté au paquet « Mes mots ».";render();
};

document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t||t.disabled)return;const f=A[t.dataset.a];if(f)f(t,e)});
document.addEventListener("keydown",e=>{
  if((e.key===" "||e.key==="Enter")&&e.target.matches&&e.target.matches(".fc")){e.preventDefault();A.flip()}
  else if(e.key==="Enter"&&!e.shiftKey&&e.target.id==="cin"){e.preventDefault();A.csend()}
});
function bindVal(e){
  const el=e.target,b=el.dataset&&el.dataset.bind;if(!b)return;
  const a=UI.ai;
  if(b.indexOf("ph:")===0)a.phr.items[+b.slice(3)].ans=el.value;
  else if(b==="phtheme")a.theme=el.value;
  else if(b==="phfocus")a.focus=el.value;
  else if(b==="sc")a.chat.sc=el.value;
  else if(b==="mtheme")a.m.theme=el.value;
}
document.addEventListener("input",bindVal);
document.addEventListener("change",bindVal);
render();
})();
</script>
</body>
</html>
