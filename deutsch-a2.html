const store={
  get(k,d){try{const v=localStorage.getItem("de-a2:"+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem("de-a2:"+k,JSON.stringify(v))}catch(e){}}
};
const CAN_SPEAK=(typeof window!=="undefined")&&("speechSynthesis" in window)&&("SpeechSynthesisUtterance" in window);
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="de-DE";u.rate=.85;window.speechSynthesis.cancel();window.speechSynthesis.speak(u)}catch(e){}}
const ICON_SPK='<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7"/></svg>';
const spkBtn=(t,label)=>CAN_SPEAK?`<button class="spk" data-a="say" data-t="${esc(t)}" aria-label="Écouter${label?" : "+esc(label):""}">${ICON_SPK}${label?`<span>${esc(label)}</span>`:""}</button>`:"";
const artChip=a=>a?`<span class="art ${a}">${a}</span>`:"";
const toTop=()=>window.scrollTo(0,0);

/* ================= ÉTAT ET MÉMOIRE ================= */
/* PR[id] = { last: 0 (à revoir) | 1 (presque) | 2 (je sais), box, due } */
let PR=store.get("prog2",{});
let DIR=store.get("dir","de");
const UI={tab:store.get("tab","cartes"),fc:null};
if(!["cartes","memo"].includes(UI.tab))UI.tab="cartes";

function stats(){
  const t=Date.now();let due=0,nw=0,ok=0,ko=0,mid=0;
  WORDS.forEach(w=>{
    const p=PR[w.id];
    if(!p){nw++;return}
    if(p.due<=t)due++;
    if(p.last===2)ok++;else if(p.last===0)ko++;else mid++;
  });
  return {due,nw,ok,ko,mid};
}

/* ================= NAVIGATION ================= */
const NAV=[
 ["cartes","Cartes",'<svg viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="12" rx="2.5"/><path d="M8 4h8"/></svg>'],
 ["memo","Mémo",'<svg viewBox="0 0 24 24"><path d="M5 5a2 2 0 012-2h11v15H7a2 2 0 00-2 2z"/><path d="M5 20a2 2 0 002 1h11"/></svg>']
];
function renderNav(){$("#nav").innerHTML=NAV.map(n=>`<button class="tab${UI.tab===n[0]?" on":""}" data-a="tab" data-t="${n[0]}"${UI.tab===n[0]?' aria-current="page"':""}>${n[2]}<span>${n[1]}</span></button>`).join("")}
const V={};
function render(){$("#view").innerHTML=V[UI.tab]();renderNav()}

/* ================= CARTES ================= */
function startFc(){
  const t=Date.now();
  const due=shuffle(WORDS.filter(w=>PR[w.id]&&PR[w.id].due<=t));
  const fresh=shuffle(WORDS.filter(w=>!PR[w.id])).slice(0,8);
  let q=due.concat(fresh).slice(0,20),practice=false;
  if(!q.length){q=shuffle(WORDS).slice(0,12);practice=true}
  UI.fc={q,i:0,flip:false,rev:false,known:0,retry:{},practice};
  render();toTop();
}
function fcCtl(){
  const s=UI.fc;
  if(!s.rev)return `<button class="btn wide" data-a="flip">Retourner</button>`;
  return `<div class="grades"><button class="g bad" data-a="grade" data-g="0">Je ne sais pas</button><button class="g mid" data-a="grade" data-g="1">Presque</button><button class="g ok" data-a="grade" data-g="2">Je sais</button></div>`;
}
function fcView(){
  const s=UI.fc;
  if(s.i>=s.q.length)return fcEnd();
  const c=s.q[s.i];
  const gc=c.art?`var(--${c.art})`:"var(--line)";
  const detail=(c.pl?`<div class="pl">Pluriel : <b>${c.art?"die "+esc(c.pl):esc(c.pl)}</b></div>`:"")
    +`<div class="ex">${esc(c.ex)}</div><div class="exfr">${esc(c.exfr)}</div>`
    +(c.note?`<div class="note">${esc(c.note)}</div>`:"");
  const deFace=`<div class="big">${artChip(c.art)} ${esc(c.de)}</div>`;
  const frFace=`<div class="lbl">Français</div><div class="big mid">${esc(c.fr)}</div>`;
  const front=DIR==="de"?deFace:frFace, back=DIR==="de"?frFace+detail:deFace+detail;
  const say=c.art?c.art+" "+c.de:c.de;
  return `<div class="topline"><span class="tiny">${s.practice?"Entraînement · ":""}Carte ${Math.min(s.i+1,s.q.length)} sur ${s.q.length}</span><button class="link" data-a="fcquit">Quitter</button></div>
  <div class="prog"><i style="width:${Math.round(100*s.i/s.q.length)}%"></i></div>
  <div class="fc${s.flip?" flip":""}" style="--gc:${gc}" data-a="flip" role="button" tabindex="0" aria-label="Carte : touche pour retourner"><div class="fc-in"><div class="face">${front}<span class="hintline">Touche pour retourner</span></div><div class="face back">${back}</div></div></div>
  <div class="spkrow">${spkBtn(say,"Le mot")}${c.ex?spkBtn(c.ex,"La phrase"):""}</div>
  <div id="fcctl">${fcCtl()}</div>`;
}
function fcEnd(){
  const s=UI.fc;
  const n=new Set(s.q.map(c=>c.id)).size;
  return `<div class="panel center"><div class="score">${s.known}</div><p>${s.known>1?"cartes sues du premier coup":"carte sue du premier coup"} sur ${n}.</p><p class="tiny">Les mots ratés reviendront bientôt.</p>
  <div class="btns"><button class="btn" data-a="study">Encore une session</button><button class="btn ghost" data-a="fcquit">Retour</button></div></div>`;
}
function bilan(){
  const ok=WORDS.filter(w=>PR[w.id]&&PR[w.id].last===2);
  const todo=WORDS.filter(w=>PR[w.id]&&PR[w.id].last!==2);
  const row=w=>`<div class="wl">${artChip(w.art)} <b>${esc(w.de)}</b> <span class="tiny">${esc(w.fr)}</span></div>`;
  return `<details><summary>Je sais bien (${ok.length})</summary><div class="md">${ok.length?ok.map(row).join(""):'<p class="tiny">Rien pour l\'instant.</p>'}</div></details>`
  +`<details${todo.length?" open":""}><summary>À travailler (${todo.length})</summary><div class="md">${todo.length?todo.map(row).join(""):'<p class="tiny">Rien à travailler.</p>'}</div></details>`;
}
V.cartes=function(){
  if(UI.fc)return fcView();
  const s=stats();
  return `<p class="sub">Retourne la carte, puis dis si tu la savais. Les mots ratés reviennent vite, les autres de plus en plus tard.</p>
  <div class="seg" role="group" aria-label="Sens des cartes"><button class="${DIR==="de"?"on":""}" data-a="dir" data-d="de">Allemand → français</button><button class="${DIR==="fr"?"on":""}" data-a="dir" data-d="fr">Français → allemand</button></div>
  <button class="btn wide" data-a="study">Réviser maintenant (${s.due} à revoir, ${Math.min(s.nw,8)} nouveaux)</button>
  <div class="stats"><div><b>${s.ok}</b><span>sus</span></div><div><b>${s.ko+s.mid}</b><span>à travailler</span></div><div><b>${s.nw}</b><span>nouveaux</span></div></div>
  <h2 class="h2">Mon bilan</h2>${bilan()}
  <p class="foot tiny">${WORDS.length} mots · <button class="link" data-a="reset">Réinitialiser ma progression</button></p>`;
};

/* ================= MÉMO ================= */
function tbl(head,rows){return `<div class="scroll"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td>${i?c:"<b>"+c+"</b>"}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
const sec=(t,b,open)=>`<details${open?" open":""}><summary>${t}</summary><div class="md">${b}</div></details>`;
V.memo=function(){
  const ar=(a,t)=>`<span class="art ${a}">${t}</span>`;
  return `<p class="sub">Ce qu'il faut avoir sous les yeux quand on écrit ou parle.</p>`+
  sec("Articles et cas",
    tbl(["","masc.","fém.","neutre","pluriel"],[
      ["Nominatif (qui ?)","der / ein","die / eine","das / ein","die"],
      ["Accusatif (quoi ?)","<b>den</b> / <b>einen</b>","die / eine","das / ein","die"],
      ["Datif (à qui ?)","dem / einem","der / einer","dem / einem","den (+ n)"]])+
    `<p>Seul le masculin change à l'accusatif : ${ar("der","der")} → ${ar("der","den")}. Le neutre et le féminin ne bougent pas.</p><p>Au datif, retiens : <b>dem, der, dem, den</b>. Verbes qui veulent le datif : <i>helfen, gehören, gefallen, schmecken</i>.</p>`,true)+
  sec("Deviner le genre",
    `<ul><li>${ar("die","die")} : -ung, -heit, -keit, -schaft, -tion, -in (die Zeitung, die Freiheit, die Information, die Lehrerin)</li><li>${ar("das","das")} : -chen, -lein, -ment, -um, les verbes devenus noms (das Mädchen, das Dokument, das Essen)</li><li>${ar("der","der")} : jours, mois, saisons, points cardinaux, -er (personne), -ling (der Montag, der Sommer, der Lehrer)</li></ul><p>Ce sont des tendances, pas des lois. Apprends toujours le mot avec son article.</p>`)+
  sec("Prépositions",
    `<p><b>Toujours accusatif</b> : durch (à travers), für (pour), gegen (contre), ohne (sans), um (autour de, à telle heure). Astuce : <i>DOGFU</i> (Durch, Ohne, Gegen, Für, Um).</p>
    <p><b>Toujours datif</b> : aus (de, hors de), bei (chez), mit (avec, en), nach (vers une ville, après), seit (depuis), von (de), zu (vers, chez).</p>
    <p><b>Datif ou accusatif</b> : an, auf, hinter, in, neben, über, unter, vor, zwischen.<br>« Wo ? » (où ?, on reste sur place) → <b>datif</b>. « Wohin ? » (vers où ?, on bouge) → <b>accusatif</b>.</p>
    ${tbl(["Contractions",""],[["zu + dem / der","zum / zur"],["in + dem / das","im / ins"],["an + dem / das","am / ans"],["auf + das","aufs"],["bei + dem, von + dem","beim, vom"]])}`)+
  sec("sein, haben, werden",
    tbl(["","sein","haben","werden"],[["ich","bin","habe","werde"],["du","bist","hast","wirst"],["er/sie/es","ist","hat","wird"],["wir","sind","haben","werden"],["ihr","seid","habt","werdet"],["sie/Sie","sind","haben","werden"]]))+
  sec("Verbes modaux",
    tbl(["","können","müssen","wollen","dürfen","sollen","möchte"],[["ich","kann","muss","will","darf","soll","möchte"],["du","kannst","musst","willst","darfst","sollst","möchtest"],["er/sie/es","kann","muss","will","darf","soll","möchte"],["wir","können","müssen","wollen","dürfen","sollen","möchten"],["ihr","könnt","müsst","wollt","dürft","sollt","möchtet"],["sie/Sie","können","müssen","wollen","dürfen","sollen","möchten"]])+
    `<p>können = pouvoir, savoir · müssen = devoir · wollen = vouloir · dürfen = avoir le droit · sollen = devoir (conseil, consigne) · möchte = je voudrais.</p><p>L'infinitif part à la fin : <i>Ich möchte ein Eis essen.</i></p>`)+
  sec("Verbes qui changent au présent",
    tbl(["infinitif","du","er/sie/es"],[["sprechen","sprichst","spricht"],["essen","isst","isst"],["sehen","siehst","sieht"],["lesen","liest","liest"],["nehmen","nimmst","nimmt"],["geben","gibst","gibt"],["fahren","fährst","fährt"],["schlafen","schläfst","schläft"],["wissen","weißt","weiß"]])+
    `<p>Le changement n'a lieu qu'à <b>du</b> et <b>er/sie/es</b>. Pour ich, wir, ihr, sie : comme d'habitude.</p>`)+
  sec("Ordre des mots",
    `<ul><li><b>Phrase simple</b> : le verbe est en 2e position. <i>Morgen gehe ich ins Kino.</i></li><li><b>Question oui/non</b> : verbe en 1er. <i>Gehst du ins Kino?</i></li><li><b>Mot interrogatif</b> : Wann, Wo, Was… puis le verbe. <i>Wo wohnst du?</i></li><li><b>Modal</b> : modal en 2e, infinitif à la fin. <i>Ich will morgen ins Kino gehen.</i></li><li><b>Verbe séparable</b> : préfixe à la fin. <i>Ich rufe dich an.</i></li><li><b>weil, dass, wenn, ob</b> : le verbe conjugué part à la fin. <i>…, weil ich müde bin.</i></li><li><b>deshalb, trotzdem</b> : ils comptent pour la place 1, le verbe suit. <i>Deshalb bleibe ich hier.</i></li><li><b>Ordre des compléments</b> : Temps, Cause, Manière, Lieu. <i>Ich fahre morgen mit dem Bus nach Hause.</i></li></ul>`)+
  sec("Le passé : Perfekt",
    `<p>Auxiliaire (<b>haben</b> ou <b>sein</b>) en 2e position, participe à la fin : <i>Ich habe Pizza gegessen. Wir sind nach Berlin gefahren.</i></p><p><b>sein</b> avec les verbes de déplacement ou de changement d'état : gehen, kommen, fahren, bleiben, aufstehen, sein. Tous les autres : <b>haben</b>.</p>`+
    tbl(["infinitif","participe"],[["machen","gemacht"],["lernen","gelernt"],["arbeiten","gearbeitet"],["essen","gegessen"],["trinken","getrunken"],["sehen","gesehen"],["lesen","gelesen"],["schreiben","geschrieben"],["nehmen","genommen"],["sprechen","gesprochen"],["finden","gefunden"],["helfen","geholfen"],["gehen","(ist) gegangen"],["kommen","(ist) gekommen"],["fahren","(ist) gefahren"],["bleiben","(ist) geblieben"],["sein","(ist) gewesen"],["anrufen","angerufen"],["aufstehen","(ist) aufgestanden"],["verstehen","verstanden (pas de ge-)"]]))+
  sec("Phrases de survie",
    tbl(["Allemand","Français"],[["Wie bitte?","Pardon ? Comment ?"],["Können Sie das bitte wiederholen?","Pouvez-vous répéter ?"],["Langsamer, bitte.","Plus lentement, s'il vous plaît."],["Was bedeutet …?","Que signifie … ?"],["Wie sagt man … auf Deutsch?","Comment dit-on … en allemand ?"],["Ich verstehe nicht.","Je ne comprends pas."],["Ich spreche nur ein bisschen Deutsch.","Je parle seulement un peu allemand."],["Ich habe eine Frage.","J'ai une question."],["Kein Problem.","Pas de souci."]]));
};

/* ================= ACTIONS ================= */
const A={};
A.tab=b=>{UI.tab=b.dataset.t;store.set("tab",UI.tab);render();toTop()};
A.say=b=>speak(b.dataset.t);
A.dir=b=>{DIR=b.dataset.d;store.set("dir",DIR);render()};
A.study=()=>startFc();
A.fcquit=()=>{UI.fc=null;render();toTop()};
A.flip=()=>{
  const s=UI.fc;if(!s)return;
  s.flip=!s.flip;if(s.flip)s.rev=true;
  const f=$(".fc");if(f)f.classList.toggle("flip",s.flip);
  const c=$("#fcctl");if(c)c.innerHTML=fcCtl();
};
A.grade=b=>{
  const s=UI.fc,g=+b.dataset.g,c=s.q[s.i];
  const p=PR[c.id]||(PR[c.id]={box:0,due:0,last:null});
  const DAY=864e5,INT=[0,1,3,7,16,35];
  p.last=g;
  if(g===0){p.box=0;p.due=Date.now()+2*60e3}
  else if(g===1){p.due=Date.now()+10*60e3}
  else{p.box=Math.min((p.box||0)+1,5);p.due=Date.now()+INT[p.box]*DAY;if(!s.retry[c.id])s.known++}
  store.set("prog2",PR);
  if(g<2){
    const n=(s.retry[c.id]||0)+1;s.retry[c.id]=n;
    if(n<=2){if(g===0)s.q.splice(Math.min(s.i+4,s.q.length),0,c);else s.q.push(c)}
  }
  s.i++;s.flip=false;s.rev=false;render();toTop();
};
A.reset=()=>{
  if(!confirm("Effacer toute ta progression ?"))return;
  PR={};store.set("prog2",PR);render();
};

document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t||t.disabled)return;const f=A[t.dataset.a];if(f)f(t,e)});
document.addEventListener("keydown",e=>{
  if((e.key===" "||e.key==="Enter")&&e.target.matches&&e.target.matches(".fc")){e.preventDefault();A.flip()}
});
render();
})();
</script>
</body>
</html>
